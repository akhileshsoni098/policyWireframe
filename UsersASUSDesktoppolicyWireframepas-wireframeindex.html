<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAS Console — Policy Administration System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- LOGIN -->
<div id="screen-login" class="login-wrapper" style="display:none;">
<div class="login-card glass">
<div class="login-logo"><div class="logo-badge">PAS</div><h1>PAS Console</h1><p>Policy Administration System — Southlake Insurance</p></div>
<div class="login-step-indicator" style="text-align:center;font-size:12px;color:var(--text-muted);margin-bottom:16px;">Step 1: Sign In</div>
<div id="login-step-1" class="login-step active">
<div class="form-group"><label class="form-label">Email Address <i class="info-btn" onclick="showInfo('policy-number')">i</i></label><input class="form-input" type="email" id="login-email" placeholder="Enter your email"></div>
<div class="form-group"><label class="form-label">Password <i class="info-btn" onclick="showInfo('policy-number')">i</i></label><input class="form-input" type="password" id="login-password" placeholder="Enter your password"></div>
<button class="btn btn-primary" style="width:100%;justify-content:center;padding:10px;" onclick="loginStep1()">Sign In</button>
<p style="text-align:center;margin-top:12px;font-size:12px;color:var(--text-muted);">Forgot password? Contact your system admin</p>
</div>
<div id="login-step-2" class="login-step">
<div class="form-group"><label class="form-label">OTP Verification Code <i class="info-btn" onclick="showInfo('policy-number')">i</i></label>
<p style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">A 6-digit code was sent to <span id="otp-email-display" style="color:var(--accent);"></span></p>
<input class="form-input" type="text" id="login-otp" placeholder="Enter 6-digit OTP" maxlength="6" style="text-align:center;font-size:20px;letter-spacing:8px;font-family:monospace;" oninput="if(this.value.length===6)loginStep2()">
</div>
<button class="btn btn-primary" style="width:100%;justify-content:center;padding:10px;" onclick="loginStep2()">Verify OTP & Sign In</button>
<p style="text-align:center;margin-top:12px;font-size:12px;color:var(--text-muted);">Didn't receive code? <a href="#" style="color:var(--accent);">Resend</a></p>
</div>
</div>
</div>
